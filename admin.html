<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Admin Panel | S Gadget & Electronics</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .topbar {
      background: #111827;
      color: white;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h2 { margin: 0; font-size: 20px; }
    .topbar p { margin: 6px 0 0; color: #d1d5db; font-size: 13px; }

    .container {
      width: min(100% - 24px, 1000px);
      margin: 22px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0000000c;
      margin-bottom: 18px;
    }

    .login-card {
      max-width: 430px;
      margin: 65px auto;
    }

    h1 { font-size: 23px; margin-top: 0; }
    h3 { margin-top: 0; }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      color: #111827;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      font-weight: bold;
    }

    .primary { background: #2563eb; color: white; }
    .danger { background: #dc2626; color: white; }
    .secondary { background: #374151; color: white; }
    .full { width: 100%; margin-top: 18px; }

    .message {
      margin-top: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .error { color: #b91c1c; }
    .success { color: #047857; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 3px 14px #0000000c;
    }

    .stat span { color: #6b7280; font-size: 13px; }
    .stat strong { display: block; font-size: 24px; margin-top: 8px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 13px;
      min-width: 0;
    }

    .product img {
      width: 100%;
      height: 155px;
      object-fit: contain;
      background: #f9fafb;
      border-radius: 8px;
    }

    .product h4 {
      margin: 12px 0 8px;
      overflow-wrap: anywhere;
    }

    .product p { margin: 6px 0; font-size: 14px; }
    .product-actions { display: flex; gap: 8px; margin-top: 12px; }
    .product-actions button { flex: 1; padding: 9px 6px; }

    .empty {
      text-align: center;
      padding: 24px 10px;
      color: #6b7280;
    }

    .muted { color: #6b7280; font-size: 13px; }
    .status { font-size: 13px; color: #d1d5db; }

    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 15px; }
      .login-card { margin-top: 35px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div>
      <h2>🛍️ S Gadget & Electronics</h2>
      <p>অ্যাডমিন কন্ট্রোল প্যানেল</p>
    </div>
    <div id="connection-status" class="status">প্রস্তুত হচ্ছে...</div>
    <button id="logout-btn" class="btn danger hidden" type="button">
      লগআউট
    </button>
  </header>

  <!-- Login -->
  <main id="login-page" class="container">
    <section class="card login-card">
      <h1>🔐 অ্যাডমিন লগইন</h1>
      <p class="muted">শুধু অনুমোদিত অ্যাডমিন প্রবেশ করতে পারবেন।</p>

      <form id="login-form">
        <label for="username">Firebase অ্যাকাউন্টের ইমেইল</label>
        <input
          id="username"
          type="email"
          autocomplete="username"
          placeholder="তোমার অ্যাডমিন ইমেইল"
          required
        >

        <label for="password">পাসওয়ার্ড</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="পাসওয়ার্ড লিখো"
          required
        >

        <button class="btn primary full" type="submit" id="login-btn">
          লগইন করো
        </button>
        <p id="login-error" class="message error" role="alert"></p>
      </form>
    </section>
  </main>

  <!-- Dashboard -->
  <main id="dashboard" class="container hidden">
    <section class="stats">
      <div class="stat">
        <span>মোট পণ্য</span>
        <strong id="total-products">0</strong>
      </div>
      <div class="stat">
        <span>মোট স্টক</span>
        <strong id="total-stock">0</strong>
      </div>
      <div class="stat">
        <span>স্টক শেষ</span>
        <strong id="out-of-stock">0</strong>
      </div>
    </section>

    <section class="card">
      <h3 id="form-title">➕ নতুন পণ্য যোগ করো</h3>

      <form id="product-form">
        <input id="edit-id" type="hidden">

        <label for="product-name">পণ্যের নাম</label>
        <input
          id="product-name"
          type="text"
          maxlength="120"
          placeholder="যেমন: Wireless Headphone"
          required
        >

        <label for="product-price">দাম (৳)</label>
        <input
          id="product-price"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="যেমন: 1500"
          required
        >

        <label for="product-stock">স্টকের সংখ্যা</label>
        <input
          id="product-stock"
          type="number"
          min="0"
          step="1"
          value="1"
          required
        >

        <label for="product-image">ছবির URL (ঐচ্ছিক)</label>
        <input
          id="product-image"
          type="url"
          placeholder="https://example.com/image.jpg"
        >

        <button class="btn primary full" type="submit" id="save-btn">
          পণ্য সেভ করো
        </button>

        <button
          class="btn secondary full hidden"
          type="button"
          id="cancel-edit"
        >
          সম্পাদনা বাতিল
        </button>

        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h3>📦 পণ্যের তালিকা</h3>
      <p class="muted">পণ্যের পরিবর্তন Firebase থেকে স্বয়ংক্রিয়ভাবে আপডেট হবে।</p>
      <div id="products-list" class="grid">
        <p class="empty">পণ্য লোড হচ্ছে...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { app, database } from "./firebase.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const ADMIN_UID = "cx3TM4XiF6StOMMKv3dER0pbG1v1";
    const auth = getAuth(app);
    const $ = id => document.getElementById(id);

    let products = [];
    let unsubscribeProducts = null;
    let busy = false;

    const productRef = ref(database, "products");

    function showMessage(id, message, type = "") {
      const element = $(id);
      element.textContent = message;
      element.className = "message " + type;
    }

    function setConnection(message) {
      $("connection-status").textContent = message;
    }

    function validProduct(product) {
      return product &&
        typeof product.id === "string" &&
        typeof product.name === "string" &&
        product.name.trim().length > 0 &&
        Number.isFinite(Number(product.price)) &&
        Number(product.price) > 0 &&
        Number.isFinite(Number(product.stock)) &&
        Number(product.stock) >= 0;
    }

    function money(amount) {
      return "৳" + Number(amount).toLocaleString("en-BD", {
        maximumFractionDigits: 2
      });
    }

    function renderProducts() {
      $("total-products").textContent = products.length;

      $("total-stock").textContent = products.reduce(
        (sum, p) => sum + Number(p.stock || 0), 0
      );

      $("out-of-stock").textContent = products.filter(
        p => Number(p.stock) === 0
      ).length;

      const list = $("products-list");
      list.replaceChildren();

      if (products.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "এখনও কোনো পণ্য যোগ করা হয়নি।";
        list.appendChild(empty);
        return;
      }

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        if (product.image) {
          const img = document.createElement("img");
          img.src = product.image;
          img.alt = product.name;
          img.loading = "lazy";
          img.onerror = () => img.remove();
          card.appendChild(img);
        }

        const name = document.createElement("h4");
        name.textContent = product.name;
        card.appendChild(name);

        const price = document.createElement("p");
        price.textContent = "দাম: " + money(product.price);
        card.appendChild(price);

        const stock = document.createElement("p");
        stock.textContent = "স্টক: " + product.stock;
        card.appendChild(stock);

        const actions = document.createElement("div");
        actions.className = "product-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "btn primary";
        editButton.textContent = "এডিট";
        editButton.addEventListener("click", () => editProduct(product.id));

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "btn danger";
        deleteButton.textContent = "ডিলিট";
        deleteButton.addEventListener("click", () => deleteProduct(product.id));

        actions.append(editButton, deleteButton);
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    async function saveProducts() {
      // Only the authorized admin should call this function.
      if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
        throw new Error("admin-not-authorized");
      }

      await set(productRef, products);
    }

    function listenToProducts() {
      if (unsubscribeProducts) {
        unsubscribeProducts();
        unsubscribeProducts = null;
      }

      setConnection("Firebase সংযোগ হচ্ছে...");

      unsubscribeProducts = onValue(
        productRef,
        snapshot => {
          const data = snapshot.val();

          const entries = Array.isArray(data)
            ? data
            : data && typeof data === "object"
              ? Object.values(data)
              : [];

          products = entries
            .filter(validProduct)
            .map(p => ({
              ...p,
              price: Number(p.price),
              stock: Number(p.stock)
            }));

          renderProducts();
          setConnection("🟢 Firebase সংযুক্ত");
        },
        error => {
          console.error("Firebase read error:", error);
          setConnection("🔴 ডেটা লোড হয়নি");
          showMessage(
            "form-message",
            "পণ্য লোড করা যায়নি। Firebase Database Rules চেক করো।",
            "error"
          );
        }
      );
    }

    $("login-form").addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;
      busy = true;
      $("login-btn").disabled = true;
      showMessage("login-error", "");

      const email = $("username").value.trim();
      const password = $("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error("Login error:", error);
        showMessage(
          "login-error",
          "লগইন ব্যর্থ হয়েছে। ইমেইল, পাসওয়ার্ড ও Firebase Auth সেটিংস চেক করো।",
          "error"
        );
      } finally {
        busy = false;
        $("login-btn").disabled = false;
      }
    });

    onAuthStateChanged(auth, async user => {
      if (user && user.uid === ADMIN_UID) {
        $("login-page").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("logout-btn").classList.remove("hidden");
        listenToProducts();
        return;
      }

      if (unsubscribeProducts) {
        unsubscribeProducts();
        unsubscribeProducts = null;
      }

      $("dashboard").classList.add("hidden");
      $("logout-btn").classList.add("hidden");
      $("login-page").classList.remove("hidden");
      setConnection("লগইন প্রয়োজন");

      if (user) {
        showMessage("login-error", "এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।", "error");
        try {
          await signOut(auth);
        } catch (error) {
          console.error("Sign-out error:", error);
        }
      }
    });

    $("logout-btn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        $("login-form").reset();
        showMessage("login-error", "");
      } catch (error) {
        console.error("Logout error:", error);
        alert("লগআউট করা যায়নি। আবার চেষ্টা করো।");
      }
    });

    $("product-form").addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;

      if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
        showMessage("form-message", "আগে অ্যাডমিন হিসেবে লগইন করো।", "error");
        return;
      }

      const id = $("edit-id").value;
      const name = $("product-name").value.trim();
      const price = Number($("product-price").value);
      const stock = Number($("product-stock").value);
      const image = $("product-image").value.trim();

      if (
        !name ||
        !Number.isFinite(price) || price <= 0 ||
        !Number.isInteger(stock) || stock < 0
      ) {
        showMessage("form-message", "নাম, দাম ও স্টকের সংখ্যা সঠিকভাবে দাও।", "error");
        return;
      }

      if (image) {
        try {
          const url = new URL(image);
          if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Invalid image URL");
          }
        } catch {
          showMessage("form-message", "ছবির সঠিক URL দাও।", "error");
          return;
        }
      }

      const previous = products.map(p => ({ ...p }));

      if (id) {
        products = products.map(p =>
          p.id === id ? { ...p, name, price, stock, image } : p
        );
      } else {
        products = [
          ...products,
          {
            id: (crypto.randomUUID
              ? crypto.randomUUID()
              : Date.now().toString() + Math.random().toString(36).slice(2)),
            name,
            price,
            stock,
            image
          }
        ];
      }

      busy = true;
      $("save-btn").disabled = true;

      try {
        await saveProducts();
        resetForm();
        showMessage(
          "form-message",
          id ? "পণ্য আপডেট হয়েছে!" : "নতুন পণ্য যোগ হয়েছে!",
          "success"
        );
      } catch (error) {
        products = previous;
        renderProducts();
        console.error("Product save error:", error);
        showMessage(
          "form-message",
          "সেভ হয়নি। ইন্টারনেট, Admin UID ও Firebase Rules চেক করো।",
          "error"
        );
      } finally {
        busy = false;
        $("save-btn").disabled = false;
      }
    });

    function editProduct(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      $("edit-id").value = product.id;
      $("product-name").value = product.name;
      $("product-price").value = product.price;
      $("product-stock").value = product.stock;
      $("product-image").value = product.image || "";
      $("form-title").textContent = "✏️ পণ্য সম্পাদনা";
      $("save-btn").textContent = "পরিবর্তন সেভ করো";
      $("cancel-edit").classList.remove("hidden");
      showMessage("form-message", "");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteProduct(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      if (!confirm(`"${product.name}" ডিলিট করতে চাও?`)) return;
      if (busy) return;

      const previous = products.map(p => ({ ...p }));
      products = products.filter(p => p.id !== id);

      busy = true;

      try {
        await saveProducts();

        if ($("edit-id").value === id) resetForm();

        showMessage("form-message", "পণ্য ডিলিট হয়েছে।", "success");
      } catch (error) {
        products = previous;
        renderProducts();
        console.error("Product delete error:", error);
        showMessage("form-message", "ডিলিট হয়নি। Firebase Rules চেক করো।", "error");
      } finally {
        busy = false;
      }
    }

    function resetForm() {
      $("product-form").reset();
      $("edit-id").value = "";
      $("product-stock").value = 1;
      $("form-title").textContent = "➕ নতুন পণ্য যোগ করো";
      $("save-btn").textContent = "পণ্য সেভ করো";
      $("cancel-edit").classList.add("hidden");
    }

    $("cancel-edit").addEventListener("click", resetForm);
  </script>
</body>
</html>
